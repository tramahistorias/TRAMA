<style>
/* ════════════════════════════════════════════════════════════
   TRAMA V2 · DESIGN SYSTEM
   Dirección artística: cinematográfica · editorial · clara
   Lujo = composición + tipografía + espacio + contraste + ritmo
   ════════════════════════════════════════════════════════════ */
:root{
  --bg:#f3efe6; --bg-2:#ebe6db; --bg-3:#e0dacd; --panel:#faf7f0;
  --line:#d6d0c3; --hair:rgba(28,26,22,.09); --hair-2:rgba(28,26,22,.18);
  --ink:#1c1a16; --paper:#1c1a16; --cream:#f4f0e8;
  --silver:#5e5b54; --dim:#8a867c;
  --gold:#9a7840; --gold-2:#7d5f2c; --gold-dim:rgba(154,120,64,.12);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Archivo",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono","Courier New",monospace;
  --nav-h:64px; --rad:3px;
  --wrap:1320px; --gut:clamp(20px,4.4vw,60px);
  --ease:cubic-bezier(.22,.61,.21,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
::selection{background:var(--gold);color:var(--cream)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font-family:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:var(--gut);padding-right:var(--gut)}
.mono{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase}
.dim{color:var(--dim)}
.ic{display:inline-flex;width:1.05em;height:1.05em;flex:none}
.ic svg{width:100%;height:100%}
.skip{position:fixed;top:-60px;left:16px;z-index:400;background:var(--gold);color:#0a0a0c;padding:10px 18px;font-weight:600;transition:top .2s}
.skip:focus{top:12px}
body::after{display:none}

/* ── Botones ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.7em;padding:1em 1.8em;font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;border-radius:var(--rad);transition:background .25s var(--ease),color .25s,border-color .25s,transform .25s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-solid{background:var(--ink);color:var(--cream)}
.btn-solid:hover{background:#000}
.btn-ghost{border:1px solid var(--hair-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-gold{border:1px solid var(--gold);color:var(--gold-2)}
.btn-gold:hover{background:var(--gold-dim)}
.btn[aria-pressed="true"] .i-plus{display:none}
.btn:not([aria-pressed]) .i-check,.btn[aria-pressed="false"] .i-check{display:none}
.btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-2)}

/* ── Chips ── */
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.42em .75em;background:rgba(8,8,10,.72);border:1px solid rgba(243,240,233,.12);border-radius:2px;color:#f3f0e9;font-size:.6rem}
.chip-gold{border-color:rgba(201,168,106,.5);color:var(--gold-2)}
.chip-trend{color:var(--gold-2)}
.catlab{color:var(--gold);font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase}

/* ── Navbar ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:300;height:var(--nav-h);display:flex;align-items:center;transition:background .35s,border-color .35s,color .35s;background:rgba(243,239,230,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--hair);color:var(--ink)}
.nav.scrolled{background:rgba(243,239,230,.96)}
body.route-home .nav{background:transparent;border-bottom-color:transparent;color:var(--cream);backdrop-filter:none}
body.route-home .nav .logo{color:var(--cream)}
body.route-home .nav-links a,body.route-home .nav-links .nlb,body.route-home .nbtn{color:rgba(243,240,233,.78)}
body.route-home .nav-links a:hover,body.route-home .nav-links .nlb:hover,body.route-home .nbtn:hover{color:var(--cream);background:rgba(243,240,233,.08)}
body.route-home .nav-links a.on{color:var(--cream)}
body.route-home .nav.scrolled{background:rgba(243,239,230,.96);border-bottom-color:var(--hair);color:var(--ink);backdrop-filter:blur(16px)}
body.route-home .nav.scrolled .logo{color:var(--ink)}
body.route-home .nav.scrolled .nav-links a,body.route-home .nav.scrolled .nav-links .nlb,body.route-home .nav.scrolled .nbtn{color:var(--silver)}
body.route-home .nav.scrolled .nav-links a:hover,body.route-home .nav.scrolled .nav-links .nlb:hover,body.route-home .nav.scrolled .nbtn:hover{color:var(--ink);background:rgba(28,26,22,.06)}
body.route-home .nav.scrolled .nav-links a.on{color:var(--ink)}
.nav-in{width:100%;max-width:1480px;margin:0 auto;padding:0 clamp(16px,3vw,44px);display:flex;align-items:center;gap:2.2rem}
.logo{display:flex;align-items:center;flex:none;line-height:0}
.logo picture{display:block;line-height:0}
.logo img{height:52px;width:auto;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
body.route-home .nav .logo img{filter:drop-shadow(0 0 10px rgba(227,205,157,.55)) drop-shadow(0 2px 8px rgba(0,0,0,.55))}
body.route-home .nav.scrolled .logo img{filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.nav-links{display:flex;gap:2.1rem;margin-left:.4rem}
.nav-links a,.nav-links .nlb{font-size:.66rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--silver);padding:6px 0;position:relative;transition:color .25s;display:inline-block}
.nav-links a:hover,.nav-links .nlb:hover{color:var(--ink)}
.nav-links a.on{color:var(--ink)}
.nav-links a.on::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--gold)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:.35rem}
.nbtn{display:inline-flex;align-items:center;gap:.5em;padding:9px 11px;color:var(--silver);border-radius:var(--rad);transition:color .25s,background .25s;font-size:.66rem;letter-spacing:.16em}
.nbtn:hover{color:var(--ink);background:rgba(28,26,22,.06)}
.nbtn .badge{background:var(--gold);color:#0a0a0c;font-family:var(--mono);font-size:.58rem;min-width:1.4em;text-align:center;padding:.18em .32em;border-radius:2px}
.cats-dd{position:relative}
.cats-panel{position:absolute;top:calc(100% + 16px);left:-24px;width:min(580px,92vw);background:var(--bg-2);border:1px solid var(--hair-2);border-radius:var(--rad);padding:10px;display:none;grid-template-columns:1fr 1fr;gap:2px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.cats-dd.open .cats-panel{display:grid}
.cats-panel a{display:block;padding:15px 16px;border-radius:2px;transition:background .2s}
.cats-panel a:hover{background:rgba(28,26,22,.05)}
.cats-panel .cn{font-family:var(--serif);font-size:1.05rem;display:block}
.cats-panel .cd{font-size:.72rem;color:var(--dim);display:block;margin-top:3px}

/* ── Hero ── */
.hero,.shero{color:var(--cream)}
.hero .btn-solid,.shero .btn-solid{background:var(--cream);color:var(--ink)}
.hero .btn-solid:hover,.shero .btn-solid:hover{background:#fff}
.hero .btn-ghost,.shero .btn-ghost{color:var(--cream);border-color:rgba(243,240,233,.35)}
.hero .btn-ghost:hover,.shero .btn-ghost:hover{border-color:var(--cream)}
.hero .btn-gold,.shero .btn-gold{color:#e3cd9d}
.hero .hero-tag,.shero .hero-tag,.hero .hero-meta,.shero .hero-meta,.hero .hero-count,.shero .crumbs{color:rgba(243,240,233,.78)}
.hero .hbtn{color:rgba(243,240,233,.8);border-color:rgba(243,240,233,.28)}
.hero .hbtn:hover{border-color:#c9a86a;color:#e3cd9d}
.hero{position:relative;min-height:max(640px,96svh);display:flex;align-items:flex-end;overflow:hidden}
.hero-bg{position:absolute;inset:0}
.hero-bg picture{position:absolute;inset:0;display:block}
.hero-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.15s ease;animation:kenburns 28s var(--ease) infinite alternate}
.hero-bg img.on{opacity:1}
@keyframes kenburns{from{transform:scale(1.04)}to{transform:scale(1.13) translate(-1.4%,1%)}}
.hero-shade{position:absolute;inset:0;background:
  linear-gradient(to top,rgba(10,10,12,.97) 0%,rgba(10,10,12,.42) 44%,rgba(10,10,12,.16) 100%),
  linear-gradient(90deg,rgba(10,10,12,.82) 0%,rgba(10,10,12,.22) 48%,transparent 74%)}
.hero-in{position:relative;z-index:2;width:100%;max-width:var(--wrap);margin:0 auto;padding:0 var(--gut) clamp(68px,10vh,116px)}
.hero-brand .hero-bg img{opacity:1;animation:none;object-position:72% 48%}
.hero-brand .hero-shade{background:
  linear-gradient(to top,rgba(8,8,10,.78) 0%,rgba(8,8,10,.18) 40%,rgba(8,8,10,.22) 100%),
  linear-gradient(90deg,rgba(8,8,10,.74) 0%,rgba(8,8,10,.38) 26%,rgba(8,8,10,.08) 44%,transparent 60%)}
.hero-copy{max-width:min(32rem,36vw)}
.hero-mark{font-family:var(--serif);font-weight:600;font-size:.95rem;letter-spacing:.36em;color:#e3cd9d;margin-bottom:1.35rem}
.hero-brand .hero-title{max-width:16ch}
.hero-universe{margin-top:2.35rem;color:rgba(243,240,233,.52);letter-spacing:.14em;max-width:54ch;opacity:0;animation:fadeUp .8s var(--ease) .7s forwards}
.hero .hero-scroll{color:rgba(243,240,233,.42)}
.hero .hero-scroll:hover{color:#e3cd9d}
.hero-kick{display:flex;align-items:center;gap:1em;color:#e3cd9d;margin-bottom:1.6rem}
.hero-kick .dot{width:6px;height:6px;background:var(--gold);border-radius:50%;animation:pulse 2.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hero-title{font-family:var(--serif);font-weight:500;font-size:clamp(2.5rem,6.6vw,5.9rem);line-height:1;letter-spacing:-.02em;max-width:14ch;text-wrap:balance}
.hero-title .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.09em;margin-bottom:-.09em}
.hero-title .w>span{display:inline-block;transform:translateY(118%);animation:wUp .95s var(--ease) forwards;animation-delay:calc(var(--i)*.05s)}
@keyframes wUp{to{transform:translateY(0)}}
.hero-tag{max-width:54ch;color:var(--silver);font-size:clamp(.95rem,1.4vw,1.12rem);margin-top:1.6rem;opacity:0;animation:fadeUp .8s var(--ease) .4s forwards}
.hero-meta{display:flex;flex-wrap:wrap;gap:1.8em;color:var(--silver);margin-top:1.7rem;opacity:0;animation:fadeUp .8s var(--ease) .5s forwards}
.hero-cta{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2.2rem;opacity:0;animation:fadeUp .8s var(--ease) .6s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero-side{position:absolute;right:clamp(16px,3.5vw,52px);bottom:clamp(60px,10vh,106px);z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:15px}
.hero-count{color:var(--silver)}
.hero-count b{color:var(--cream);font-weight:500}
.hero-nav{display:flex;gap:8px}
.hbtn{width:42px;height:42px;border:1px solid var(--hair-2);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--silver);transition:.25s;font-size:.88rem}
.hbtn:hover{border-color:var(--gold);color:var(--gold-2)}
.hero-prog{width:120px;height:1px;background:var(--hair-2);overflow:hidden}
.hero-prog i{display:block;height:100%;background:var(--gold);width:0}
.hero-prog i.run{animation:hprog 9s linear forwards}
@keyframes hprog{to{width:100%}}
.hero-scroll{position:absolute;left:clamp(20px,4.4vw,60px);bottom:22px;z-index:3;color:var(--dim);display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;padding:8px 0;font:inherit;letter-spacing:.16em}
.hero-scroll:hover{color:#e3cd9d}
.hero-scroll .sline{width:56px;height:1px;background:var(--hair-2);position:relative;overflow:hidden}
.hero-scroll .sline::after{content:"";position:absolute;inset:0;background:var(--gold);transform:translateX(-100%);animation:slide 2.8s var(--ease) infinite}
@keyframes slide{40%{transform:translateX(0)}100%{transform:translateX(102%)}}

/* ── Ticker ── */
.ticker{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);overflow:hidden}
.ticker-track{display:flex;width:max-content;animation:tick 56s linear infinite;padding:13px 0}
.ticker-track span{font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);padding:0 2.4rem;display:flex;align-items:center;gap:2.4rem}
.ticker-track span::after{content:"·";color:var(--gold)}
@keyframes tick{to{transform:translateX(-50%)}}

/* ── Secciones ── */
.section{padding:clamp(72px,10vw,128px) 0}
.section.tight{padding:clamp(44px,6vw,80px) 0}
.shead{display:flex;align-items:baseline;gap:1.4rem;margin-bottom:clamp(30px,4vw,50px)}
.shead .idx{color:var(--gold);font-family:var(--mono);font-size:.68rem;letter-spacing:.2em}
.shead h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.65rem,3.4vw,2.6rem);letter-spacing:-.01em}
.shead .rule{flex:1;height:1px;background:var(--hair);align-self:center}
.shead a.more{color:var(--silver);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;transition:color .25s;white-space:nowrap}
.shead a.more:hover{color:var(--gold-2)}
[data-rv]{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .85s var(--ease)}
[data-rv].in{opacity:1;transform:none}

/* ── Imágenes / frames ── */
.frame{position:relative;overflow:hidden;background:var(--bg-3);border-radius:var(--rad)}
.frame picture{display:block;width:100%;height:100%}
.frame::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,#ddd7cb 40%,#ece7dc 50%,#ddd7cb 60%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.frame img{position:relative;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease,transform 1.1s var(--ease)}
.frame img.ld{opacity:1}
.scard:hover .frame img.ld,.titem:hover .frame img.ld,.shcard:hover .frame img.ld{transform:scale(1.045)}
.ratio-16{aspect-ratio:16/9}
.ratio-916{aspect-ratio:9/16}
.ratio-34{aspect-ratio:3/4}
.ratio-45{aspect-ratio:4/5}

/* ── Cards editoriales ── */
.sgrid{display:grid;gap:clamp(34px,4vw,52px) clamp(22px,2.8vw,36px)}
.sgrid.g3{grid-template-columns:repeat(3,1fr)}
.sgrid.g4{grid-template-columns:repeat(4,1fr)}
.scard{display:flex;flex-direction:column;gap:18px}
.scard-m{position:relative}
.scard-m .frame{border:1px solid var(--hair)}
.scard-m .chip{position:absolute;right:14px;top:14px}
.scard-top{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.scard-t{font-family:var(--serif);font-weight:500;font-size:clamp(1.15rem,1.6vw,1.38rem);line-height:1.16;margin-top:10px;transition:color .25s}
.scard:hover .scard-t{color:var(--gold-2)}
.scard-d{color:var(--silver);font-size:.85rem;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard-xl .scard-t{font-size:clamp(1.35rem,2vw,1.75rem)}
.scard-xl .scard-d{-webkit-line-clamp:3;font-size:.9rem}

/* ── Filas ── */
.row{position:relative}
.row-track{display:flex;gap:clamp(18px,2.2vw,28px);overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 4px 18px;scrollbar-width:none}
.row-track::-webkit-scrollbar{display:none}
.row-track>*{scroll-snap-align:start;flex:none}
.rowbtns{position:absolute;top:-70px;right:0;display:flex;gap:8px}

/* ── Tendencias (ranking editorial) ── */
.titem{width:min(470px,80vw);display:flex;align-items:flex-end;position:relative;padding-left:clamp(40px,4.6vw,68px)}
.tnum{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(6.4rem,10.5vw,9.6rem);line-height:.76;color:transparent;-webkit-text-stroke:1px rgba(28,26,22,.22);position:absolute;left:0;bottom:78px;z-index:0;user-select:none;transition:-webkit-text-stroke-color .35s}
.titem:hover .tnum{-webkit-text-stroke-color:var(--gold)}
.tcard{position:relative;width:100%;z-index:1}
.tcard .frame{border:1px solid var(--hair)}
.tcard-g{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,10,.93) 0%,rgba(8,8,10,.12) 58%);border-radius:var(--rad)}
.tcard-b,.cat-tile .tb{color:#f4f0e8}
.tcard-b .tm,.cat-tile p{color:rgba(243,240,233,.72)}
.tcard-b h3{font-family:var(--serif);font-weight:500;font-size:1.22rem;line-height:1.18;margin-top:7px}
.tcard-b .tm{margin-top:8px;color:var(--silver)}

/* ── Shorts cards (fila Inicio: 16:9 compacto) ── */
.shcard{width:min(188px,46vw)}
.shcard-m{position:relative}
.shcard-m .frame{border:1px solid var(--hair)}
.shcard-m .chip{position:absolute;top:8px;left:8px}
.shcard h3{font-family:var(--serif);font-weight:500;font-size:.92rem;line-height:1.22;margin-top:8px;color:var(--ink)}
.shcard .sh-meta{display:block;margin-top:5px;color:var(--dim)}
.shcard:hover h3{color:var(--gold-2)}
.shorts-intro{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,5vw,84px);align-items:end;margin-bottom:clamp(30px,4vw,48px)}
.shorts-intro p{color:var(--silver);max-width:46ch}
.shorts-intro .big{font-family:var(--serif);font-size:clamp(1.75rem,3.4vw,2.8rem);font-weight:500;line-height:1.08;letter-spacing:-.01em}
.shorts-intro .big em{font-style:italic;color:var(--gold)}

/* ── Elección del editor ── */
.ed-band{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(30px,5vw,84px);align-items:center}
.ed-band .frame{border:1px solid var(--hair)}
.ed-quote{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(1.3rem,2.1vw,1.75rem);line-height:1.42;margin:1.3rem 0 1.8rem;color:var(--paper)}

/* ── Newsletter ── */
.news{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,96px);align-items:center;border-top:1px solid var(--hair);padding-top:clamp(56px,7vw,90px)}
.news h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.7rem,3.2vw,2.7rem);line-height:1.1;letter-spacing:-.01em}
.news .sub{color:var(--silver);margin-top:16px;max-width:42ch}
.news .phil{font-family:var(--serif);font-style:italic;color:var(--dim);margin-top:22px;font-size:.95rem}
.news form{display:flex;gap:10px}
.news input{flex:1;background:var(--panel);border:1px solid var(--hair-2);border-radius:var(--rad);padding:0 18px;height:54px;color:var(--ink);font-size:.95rem;transition:border-color .25s}
.news input::placeholder{color:var(--dim)}
.news input:focus{border-color:var(--gold);outline:none}
.news .priv{margin-top:14px;color:var(--dim);font-size:.66rem;letter-spacing:.1em}
.news-ok{font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--gold)}

/* ── Footer ── */
.footer{border-top:1px solid var(--hair);padding:clamp(60px,7vw,96px) 0 44px;background:var(--bg-2)}
.f-top{display:flex;justify-content:space-between;align-items:flex-start;gap:3rem;flex-wrap:wrap;margin-bottom:clamp(48px,6vw,76px)}
.f-mark{line-height:0}
.f-mark img{height:clamp(96px,14vw,140px);width:auto;object-fit:contain}
.f-claim{color:var(--dim);font-style:italic;font-family:var(--serif);margin-top:14px;font-size:1rem;max-width:24ch;line-height:1.5}
.f-cols{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:clamp(26px,4vw,60px);flex:1;min-width:min(580px,100%)}
.f-cols h4{font-family:var(--mono);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:20px;font-weight:500}
.f-cols a{display:block;color:var(--silver);font-size:.88rem;padding:5px 0;transition:color .2s}
.f-cols a:hover{color:var(--ink)}
.f-bot{border-top:1px solid var(--hair);margin-top:clamp(44px,5vw,64px);padding-top:26px;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:var(--dim)}

/* ── Página de historia ── */
.shero{position:relative;min-height:max(560px,84svh);display:flex;align-items:flex-end;overflow:hidden}
.shero-bg{position:absolute;inset:-12% 0}
.shero-bg img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
.shero-bg img.ld{opacity:1}
.shero .hero-shade{background:linear-gradient(to top,rgba(10,10,12,1) 4%,rgba(10,10,12,.5) 46%,rgba(10,10,12,.28))}
.crumbs{display:flex;gap:.9em;flex-wrap:wrap;color:var(--dim);margin-bottom:1.8rem}
.crumbs a:hover{color:var(--gold-2)}
.img-disc{color:var(--dim);max-width:62ch;margin:-.4rem 0 1.6rem;font-size:.82rem;line-height:1.55}
.about-logo{width:min(280px,70vw);height:auto;margin:0 0 2.2rem;background:transparent}
.ply-soon{position:relative;aspect-ratio:16/9;background:#000;border:1px solid var(--hair);border-radius:var(--rad);overflow:hidden;display:flex;align-items:flex-end}
.ply-soon::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,10,.92) 0%,rgba(8,8,10,.45) 48%,rgba(8,8,10,.2) 100%)}
.ply-soon .mx{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.ply-soon .mx.ld{opacity:.55}
.ply-soon-in{position:relative;z-index:2;padding:clamp(22px,4vw,40px);max-width:42rem}
.ply-soon-in p{color:rgba(243,240,233,.82);font-size:1.02rem;margin:10px 0 1.3rem;max-width:46ch}
.contact-row a{color:var(--gold-2)}
.contact-row a:hover{color:var(--ink)}
.contact-form{display:flex;flex-direction:column;gap:12px;margin:1.4rem 0 1.8rem;max-width:32rem}
.contact-form input,.contact-form textarea{background:var(--panel);border:1px solid var(--hair-2);border-radius:var(--rad);padding:14px 18px;color:var(--ink);font-size:.95rem;font-family:inherit}
.contact-form textarea{min-height:140px;resize:vertical;line-height:1.5}
.contact-form input:focus,.contact-form textarea:focus{border-color:var(--gold);outline:none}
.contact-actions{display:flex;flex-wrap:wrap;gap:10px}
.contact-mail{font-size:1.05rem;letter-spacing:.02em}
.story-body{max-width:760px}
.story-body .kick{color:var(--gold);display:block;margin-bottom:2rem}
.story-body p{font-family:var(--serif);font-weight:400;font-size:clamp(1.05rem,1.5vw,1.22rem);line-height:1.78;color:#2c2924;margin-bottom:1.7em}
.story-body p:first-of-type::first-letter{font-size:3.4em;float:left;line-height:.82;padding-right:.14em;color:var(--gold-2);font-weight:500}
.legal-body p:first-of-type::first-letter{font-size:inherit;float:none;line-height:inherit;padding:0;color:inherit;font-weight:inherit}
.legal-body h2{font-family:var(--serif);font-weight:500;font-size:1.28rem;margin:2.1em 0 .7em;letter-spacing:-.01em}
.legal-body ul{margin:0 0 1.5em 1.15em;color:#2c2924;line-height:1.7;font-size:.95rem}
.legal-body li{margin-bottom:.4em}
.legal-body a{color:var(--gold-2)}
.sitemap{display:grid;gap:clamp(28px,4vw,48px);padding-bottom:4rem}
.sitemap h2{font-family:var(--serif);font-weight:500;font-size:1.35rem;margin:0 0 .8rem}
.sitemap a{display:block;padding:.55rem 0;border-bottom:1px solid var(--hair);color:var(--ink);font-size:.92rem}
.sitemap a:hover{color:var(--gold-2)}
.sitemap .sm-k{font-size:.62rem;letter-spacing:.16em;color:var(--dim);display:block;margin-bottom:.35rem}
.pull{border-left:2px solid var(--gold);padding:.4em 0 .4em 1.7em;margin:2.6em 0;font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,2.4vw,1.7rem);line-height:1.42;color:var(--paper)}
/* Cronología con raíl */
.tl-rail{position:relative;margin-top:1.6rem;padding-left:36px}
.tl-rail::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:1px;background:var(--hair-2)}
.tl-item{position:relative;padding:20px 0;border-bottom:1px solid var(--hair)}
.tl-item:last-child{border-bottom:0}
.tl-dot{position:absolute;left:-36px;top:29px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1px solid var(--gold)}
.tl-yr{font-family:var(--mono);color:var(--gold);letter-spacing:.16em;font-size:.72rem}
.tl-tx{color:var(--silver);font-size:.95rem;margin-top:7px;max-width:62ch;line-height:1.65}
/* Ficha agrupada */
.fgroup{margin-top:2rem}
.fgroup .fg-l{display:block;margin-bottom:12px;color:var(--dim)}
.ficha{display:flex;flex-wrap:wrap;gap:10px}
.ficha a{border:1px solid var(--hair-2);border-radius:2px;padding:.6em 1em;font-size:.8rem;color:var(--silver);display:inline-flex;gap:.7em;align-items:baseline;transition:.25s}
.ficha a:hover{border-color:var(--gold);color:var(--gold-2)}
.ficha a .mono{color:var(--dim);font-size:.56rem}

/* ── Reproductor ── */
.ply-wrap{margin-top:clamp(36px,5vw,60px)}
.ply{position:relative;aspect-ratio:16/9;background:#000;border:1px solid var(--hair);border-radius:var(--rad);overflow:hidden}
.ply .mx{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s}
.ply .mx.ld{opacity:.6}
.ply.is-playing .mx.ld{opacity:.32}
.ply-shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.55))}
.ply-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:3}
.ply.started .ply-mid{display:none}
.ply-big{width:94px;height:94px;border-radius:50%;background:var(--cream);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.6rem;transition:transform .35s var(--ease),background .25s;padding-left:6px}
.ply-big:hover{transform:scale(1.07);background:#fff}
.ply-resume{border:1px solid rgba(243,240,233,.3);padding:.85em 1.5em;border-radius:2px;color:#f4f0e8;transition:.25s}
.ply-resume:hover{border-color:var(--gold);color:var(--gold-2)}
.ply-demo{position:absolute;top:14px;left:14px;z-index:4;color:var(--dim);background:rgba(0,0,0,.5);padding:.5em .8em;border-radius:2px}
.ply-bar{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:16px;padding:15px 18px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent)}
.ply-pp{color:#f4f0e8;font-size:1.1rem;display:flex}
.ply-track{flex:1;height:14px;display:flex;align-items:center;cursor:pointer}
.ply-track i{display:block;width:100%;height:2px;background:var(--hair-2);position:relative}
.ply-track i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--pw,0%);background:var(--gold)}
.ply-time{color:rgba(243,240,233,.75)}
.ply-frame{position:relative;aspect-ratio:16/9;background:#000;border:1px solid var(--hair);border-radius:var(--rad);overflow:hidden}
.ply-frame iframe,.ply-frame video{position:absolute;inset:0;width:100%;height:100%;border:0}
.ply-frame video{object-fit:cover;background:#000}

/* ── Cortos: un reproductor + rejilla ── */
body.route-shorts{background:var(--bg);color:var(--ink)}
body.route-shorts .nav{background:rgba(243,239,230,.96)}
body.route-shorts .footer{display:block}
.shorts-page .phead{padding-top:calc(var(--nav-h) + clamp(28px,4vw,48px));padding-bottom:clamp(16px,2.4vw,28px)}
.shorts-page .phead h1{font-size:clamp(1.7rem,3.2vw,2.55rem)}
.shorts-page .phead .sub{margin-top:.7rem}
.s-watch{padding-bottom:clamp(28px,4vw,48px)}
.short{position:relative}
.short>.bg,.short>picture.bg,.short>img.bg{display:none!important}
.s-stage{display:grid;grid-template-columns:minmax(0,420px) minmax(200px,1fr);gap:clamp(18px,3vw,36px);align-items:center;max-width:860px}
.s-frame{position:relative;z-index:2;width:100%;aspect-ratio:16/9;border:1px solid var(--hair-2);border-radius:6px;overflow:hidden;background:#111}
.s-frame img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s}
.s-frame img.ld{opacity:1}
.s-frame video,.s-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg-3)}
.s-frame video{object-fit:cover}
.short.s-yt .s-big,.short.s-yt .s-prog,.short.s-yt [data-act="short-play"]{display:none}
.s-copy{max-width:28rem}
.s-title{font-family:var(--serif);font-weight:500;font-size:clamp(1.2rem,2vw,1.55rem);line-height:1.18;margin-top:10px;letter-spacing:-.02em;color:var(--ink)}
.s-sub{color:var(--silver);font-size:.9rem;line-height:1.5;margin-top:10px;max-width:42ch}
.s-ctas{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.s-cta{display:inline-flex}
.s-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(28,26,22,.12);z-index:4}
.s-prog i{display:block;height:100%;width:0;background:var(--gold)}
.short.playing .s-prog i{animation:sprog var(--sdur,40s) linear forwards}
.short.paused .s-prog i{animation-play-state:paused}
.s-frame:has(video) .s-prog i{animation:none!important}
@keyframes sprog{to{width:100%}}
.short.playing .s-big{opacity:0}
.s-big{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(243,239,230,.94);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.05rem;z-index:3;transition:opacity .3s;padding-left:4px}
.s-catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px 14px}
.scat .frame{border:1px solid var(--hair)}
.scat .chip{position:absolute;top:8px;left:8px;z-index:2}
.scat h3{font-family:var(--serif);font-weight:500;font-size:.9rem;line-height:1.22;margin-top:8px}
.scat .catlab{display:block;margin-top:6px}
.scat.on .frame{outline:1px solid var(--gold);outline-offset:2px}
.scat:hover h3{color:var(--gold-2)}
.scat:hover .frame img.ld{transform:scale(1.045)}

/* ── Buscador ── */
.search-ov{position:fixed;inset:0;z-index:350;background:rgba(243,239,230,.97);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;overflow-y:auto}
.search-ov.open{opacity:1;visibility:visible}
.search-in{max-width:940px;margin:0 auto;padding:clamp(84px,12vh,144px) var(--gut) 84px}
.search-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2.8rem}
.search-input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--hair-2);color:var(--ink);font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,4.5vw,3rem);padding:10px 0 20px;letter-spacing:-.01em}
.search-input::placeholder{color:#b5b0a4}
.search-input:focus{border-color:var(--gold);outline:none}
.sg-h{color:var(--gold);margin:2.6rem 0 1.1rem;display:flex;align-items:center;gap:1rem}
.sg-h::after{content:"";flex:1;height:1px;background:var(--hair)}
.sg-list{display:flex;flex-direction:column}
.sr{display:flex;gap:20px;align-items:center;padding:15px 10px;border-radius:var(--rad);transition:background .2s}
.sr:hover{background:rgba(28,26,22,.05)}
.sr .thumb{width:96px;aspect-ratio:16/10;flex:none;overflow:hidden;border-radius:2px;background:var(--bg-3)}
.sr .thumb.v{aspect-ratio:9/14;width:58px}
.sr .thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.sr .thumb img.ld{opacity:1}
.sr h4{font-family:var(--serif);font-weight:500;font-size:1.08rem;line-height:1.25}
.sr .mono{color:var(--dim);display:block;margin-top:6px;font-size:.58rem}
.s-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:1.8rem}
.s-chips button{border:1px solid var(--hair-2);border-radius:2px;padding:.75em 1.2em;color:var(--silver);font-size:.8rem;transition:.25s}
.s-chips button:hover{border-color:var(--gold);color:var(--gold-2)}
.s-empty{padding:3.6rem 0;color:var(--silver)}
.s-empty .serif{font-family:var(--serif);font-style:italic;font-size:1.6rem;color:var(--paper);display:block;margin-bottom:.8rem}

/* ── Cabeceras de página ── */
.phead{padding-top:calc(var(--nav-h) + clamp(52px,8vw,100px));padding-bottom:clamp(30px,4vw,52px)}
.phead .catlab{display:block;margin-bottom:1.3rem}
.phead h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.3rem,5.8vw,4.6rem);letter-spacing:-.018em;line-height:1.02}
.phead .sub{color:var(--silver);margin-top:1.2rem;max-width:62ch;font-size:clamp(.95rem,1.3vw,1.08rem)}
.phead .count{color:var(--dim);display:block;margin-top:1.8rem}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:2rem}
.chips button{border:1px solid var(--hair-2);border-radius:2px;padding:.72em 1.2em;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--silver);transition:.25s}
.chips button:hover{color:var(--ink);border-color:var(--ink)}
.chips button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.ent-grid{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:clamp(30px,5vw,76px);align-items:start;margin-top:1.8rem}
.ent-card .frame{border:1px solid var(--hair)}
.ent-card .era{color:var(--dim);display:block;margin-top:1.1rem}
.cat-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2.2vw,26px)}
.cat-tile{position:relative;overflow:hidden;border-radius:var(--rad);border:1px solid var(--hair)}
.cat-tile picture{position:absolute;inset:0;display:block}
.cat-tile img{width:100%;height:100%;object-fit:cover;opacity:0;transition:transform 1s var(--ease),opacity .7s}
.cat-tile img.ld{opacity:1}
.cat-tile:hover img{transform:scale(1.06)}
.cat-tile .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,10,.93) 8%,rgba(8,8,10,.12) 62%)}
.cat-tile .tb{position:absolute;left:20px;right:20px;bottom:18px}
.cat-tile h3{font-family:var(--serif);font-weight:500;font-size:1.55rem;margin-top:7px}
.cat-tile p{color:rgba(243,240,233,.72);font-size:.78rem;margin-top:7px;line-height:1.5}

/* ── Continuar viendo ── */
.cw{width:min(330px,74vw)}
.cw .pw{height:2px;background:var(--hair-2)}
.cw .pw i{display:block;height:100%;background:var(--gold)}
.cw .rm{color:var(--dim);margin-top:9px;display:flex;justify-content:space-between;gap:1rem}
.cw .rm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Vacíos / pn ── */
.empty{padding:clamp(64px,9vw,116px) 0;text-align:center}
.empty .serif{font-family:var(--serif);font-style:italic;font-size:clamp(1.5rem,3vw,2.3rem);display:block;margin-bottom:1.1rem}
.empty p{color:var(--silver);margin-bottom:2.2rem}
.pn{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.pn a{padding:clamp(30px,4vw,48px) var(--gut);transition:background .3s}
.pn a:hover{background:rgba(28,26,22,.04)}
.pn a+a{border-left:1px solid var(--hair);text-align:right}
.pn .mono{color:var(--dim)}
.pn h3{font-family:var(--serif);font-weight:500;font-size:clamp(1.15rem,2vw,1.55rem);margin-top:11px}
.pn a:hover h3{color:var(--gold-2)}

/* ── Toast / menú / tabbar ── */
#toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:399;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--hair-2);border-left:2px solid var(--gold);color:var(--ink);padding:.95em 1.5em;border-radius:2px;font-size:.82rem;opacity:0;transform:translateY(12px);transition:.35s var(--ease)}
.toast.on{opacity:1;transform:none}
.menu-ov{position:fixed;inset:0;z-index:340;background:rgba(243,239,230,.98);opacity:0;visibility:hidden;transition:.35s;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(24px,7vw,80px)}
.menu-ov.open{opacity:1;visibility:visible}
.menu-ov a.ml{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,7vw,3.2rem);padding:.34em 0;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.menu-ov a.ml .mono{color:var(--dim);font-size:.6rem}
.menu-ov a.ml:hover{color:var(--gold)}
.menu-close{position:absolute;top:16px;right:16px;font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;color:var(--silver);padding:10px}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:310;background:rgba(243,239,230,.96);border-top:1px solid var(--hair);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:6px 0}
.tabbar a.on,.tabbar button:active{color:var(--gold)}
.tabbar .ic{width:1.35em;height:1.35em}

/* ── Responsive ── */
@media (max-width:1180px){ .nbtn-extra{display:none} }
@media (max-width:1100px){ .sgrid.g4{grid-template-columns:repeat(3,1fr)} }
@media (max-width:900px){
  .nav-links{display:none}
  .tabbar{display:flex}
  body{padding-bottom:66px}
  #toasts{bottom:86px}
  .sgrid.g3,.sgrid.g4{grid-template-columns:repeat(2,1fr)}
  .news,.ed-band{grid-template-columns:1fr}
  .f-cols{grid-template-columns:repeat(2,1fr)}
  .ent-grid{grid-template-columns:1fr}
  .cat-tiles{grid-template-columns:repeat(2,1fr)}
  .shorts-intro{grid-template-columns:1fr}
  .hero-side{display:none}
  .s-stage{grid-template-columns:1fr;gap:16px;max-width:420px}
  .s-copy{width:100%;max-width:42rem;padding:0 2px}
  .rowbtns{display:none}
  .hero-copy{max-width:34rem}
}
@media (max-width:640px){
  /* Grids → filas deslizables tipo app */
  .sgrid{display:flex!important;overflow-x:auto;scroll-snap-type:x mandatory;gap:18px;padding-bottom:12px;scrollbar-width:none}
  .sgrid::-webkit-scrollbar{display:none}
  .sgrid>*{flex:none;width:min(330px,82vw);scroll-snap-align:start}
  .news form{flex-direction:column}
  .pn{grid-template-columns:1fr}
  .pn a+a{border-left:0;border-top:1px solid var(--hair);text-align:left}
  .hero{min-height:90svh}
  .hero-cta{flex-direction:column;align-items:stretch}
  .hero-scroll{display:none}
  .hero-copy{max-width:36rem}
  .hero-brand .hero-bg img{object-position:58% 42%}

{slug:'kodak-y-el-futuro-que-dejo-escapar', cat:'empresas', title:'Kodak — La empresa que inventó el futuro digital',
 tagline:'Si Kodak ayudó a inventar el futuro digital, ¿por qué no consiguió dominarlo?',
 desc:'En 1975, en Rochester, Steve Sasson construyó uno de los primeros prototipos de cámara digital. Kodak no ignoró aquel aparato. El problema fue otro: el futuro que anunciaba no se parecía al negocio que la había hecho indispensable.',
 durMin:10, durSec:600, date:'2026-06-12', views:0, yt:null,
 flags:['featured','editors'], tags:['fotografía','innovación','disrupción'], sources:['USPTO · Patente 4.131.919','Kodak · solicitud de Chapter 11, enero de 2012'],
 entities:['kodak','steve-sasson','george-eastman','camara-digital','fotografia'],
 body:[
 'Kodak no nació como una empresa de cámaras. Nació como una empresa de memoria. En 1888 George Eastman puso en el mercado un aparato simple y una frase que todavía explica el siglo XX: usted aprieta el botón; nosotros hacemos el resto. El resto era el carrete, la química, el papel. Cada fotografía dejaba un rastro de consumo. Ese rastro era el negocio.',
 'El modelo era elegante y voraz. La cámara podía ser accesible porque el beneficio estaba en lo que ocurría después: revelar, copiar, repetir. Kodak no vendía un instante. Vendía la infraestructura invisible de todos los instantes. Durante décadas, fotografiar el mundo y comprar Kodak fueron casi la misma acción.',
 'En 1975, en los laboratorios de Rochester, un ingeniero llamado Steve Sasson construyó un prototipo distinto. Usaba un sensor CCD, grababa la imagen en una cinta de casete, tardaba unos veintitrés segundos y devolvía en un televisor una imagen en blanco y negro de unos diez mil píxeles. No consumía carrete. No consumía papel. No se parecía a Kodak.',
 'La pregunta que aquella máquina planteaba no era técnica. Era existencial: si la fotografía deja de ser química, ¿qué queda de una empresa cuyo beneficio es químico? Kodak no metió el prototipo en un cajón y apagó la luz. Registró la patente. Siguió investigando. Llegó a fabricar y vender cámaras digitales. En algunos años del nuevo siglo incluso lideró ese mercado en Estados Unidos. Lo digital no fue un secreto. Fue un dilema.',
 'El dilema tenía forma de cuenta de resultados. El carrete, el papel y los químicos seguían pagando los dividendos. Las cámaras digitales se vendían, pero no alimentaban la máquina de revelado. Cada unidad digital era, a la vez, un producto y una amenaza. Kodak financió el futuro con una mano y protegió el presente con la otra. Esa tensión no es estupidez: es lo que ocurre cuando una innovación verdadera canibaliza el negocio que la hace posible.',
 'Mientras tanto el mercado se movió más rápido que el organigrama. Sony, Canon, Nikon y Fuji empujaron el sensor. Después el teléfono convirtió la cámara en una función, no en un aparato. Las fotos dejaron de revelarse. Se copiaron. Se enviaron. Se olvidaron. El volumen de imágenes explotó; el margen de Kodak se evaporó. No fue que el mundo dejara de fotografiar. Fue que dejó de pagar por fotografiar como Kodak había enseñado a pagar.',
 'En enero de 2012 Kodak se acogió al Chapter 11. No desapareció. Salió del concurso al año siguiente, reorganizada: impresión comercial, packaging, química, patentes. La empresa que había puesto una cámara en cada casa siguió existiendo, pero ya no era el centro del gesto de hacer una foto. El futuro digital que había ayudado a construir se había ido a vivir a otra parte.',
 'Esta historia no pregunta si Kodak vio venir lo digital. Pregunta algo más incómodo: qué ocurre cuando una organización inventa el mañana y descubre que el mañana no puede mantener el edificio que la sostiene. Kodak no fracasó por no imaginar el futuro. Fracasó, en parte, por imaginarlo demasiado bien.'],
 quote:'Kodak no ignoró lo digital. Lo digital ignoró el modelo que había hecho rica a Kodak.',

 timeline:[['1888','George Eastman lanza la cámara Kodak: el beneficio no está en el aparato, sino en el carrete, la química y el papel.'],['1975','Steve Sasson construye en Rochester uno de los primeros prototipos de cámara digital: sensor CCD, cinta de casete, unos 23 segundos por imagen.'],['1978','Se concede la patente estadounidense 4.131.919 sobre el sistema de captura electrónica de imágenes.'],['2001–2005','Kodak comercializa cámaras digitales a gran escala. El carrete sigue siendo el centro de beneficio; el sensor, el dilema.'],['ENE 2012','Kodak se acoge al Chapter 11. El mercado de la fotografía cotidiana ya no pasa por el revelado.'],['2013','La empresa sale del concurso reorganizada. Kodak continúa; el gesto de fotografiar el mundo, no.']]},
{slug:'la-guerra-de-las-corrientes', cat:'historia', title:'La guerra de las corrientes',
 tagline:'Edison tenía la fama. Westinghouse tenía a Tesla. Y el mundo, literalmente, tuvo que elegir cómo iluminarse.',
 desc:'En la década de 1880 dos sistemas eléctricos se disputaron el futuro: la corriente continua de Edison y la corriente alterna de Tesla y Westinghouse.',

 entities:['nikola-tesla','thomas-edison','westinghouse','general-electric','corriente-alterna','energia'],
 body:[
 'Edison había inventado no solo una bombilla sino un sistema completo: generadores, cableado, contadores. Su imperio dependía de la corriente continua. Cuando un joven ingeniero serbio llamado Nikola Tesla le propuso un sistema radicalmente distinto basado en corriente alterna, Edison no discutió la idea: despidió al hombre.',
 'Tesla acabó aliándose con George Westinghouse, el único industrial con fábricas y ambición suficientes para desafiar al inventor más famoso del planeta. La campaña de Edison fue feroz: demostraciones públicas, presión política y un invento macabro —la silla eléctrica— alimentado con corriente alterna para asociarla con la muerte.',
 'Pero la física no entiende de propaganda. La corriente alterna viajaba cientos de kilómetros; la continua, apenas un par. Cuando Westinghouse iluminó la Exposición de Chicago de 1893 y después aprovechó las cataratas del Niágara para electrificar Buffalo, la guerra terminó sin tratado de paz.',
 'Hoy cada enchufe del planeta es un monumento involuntario a Tesla y una ironía para Edison: el hombre que electrificó el mundo perdió el sistema que lo haría posible.'],
 quote:'Edison ganó todos los titulares. Tesla ganó todos los enchufes.',

{slug:'el-hombre-que-detuvo-el-mundo', cat:'historia', title:'El hombre que detuvo el mundo',
 tagline:'Veintiséis de septiembre de 1983. Cinco misiles en la pantalla. Y un solo hombre entre la pantalla y el botón.',
 desc:'Stanislav Petrov era el oficial de guardia del sistema de alerta nuclear soviético cuando el ordenador anunció un ataque estadounidense. Decidió no creer a la máquina.',
 durMin:1, durSec:45, date:'2026-08-25', views:0, yt:'aiWhso5jI7U',
 flags:['featured','new'], tags:['guerra fría','decisiones','nuclear'], sources:['Entrevistas S. Petrov, 2004–2013','Archivos desclasificados CIA'],
 entities:['stanislav-petrov','guerra-fria'],
 body:[
 'El protocolo era inequívoco: si el sistema de satélites detectaba lanzamiento de misiles, el oficial de guardia debía informar al Estado Mayor, y el Estado Mayor, recomendar la respuesta. Aquella noche, el sistema detectó uno. Luego dos. Luego cinco.',
 'Petrov tenía minutos. Su formación le decía que confiara en la máquina; su instinto le susurraba una anomalía: si Estados Unidos iniciara una guerra nuclear, no lanzaría cinco misiles. Lanzaría cientos. Clasificó la alerta como fallo del sistema. Y esperó.',
 'No pasó nada. Nunca pasó nada. Los satélites habían confundido el reflejo del sol sobre nubes altas con estelas de lanzamiento. Petrov no recibió condecoraciones: recibió una reprimenda leve y una jubilación silenciosa. El mundo nunca supo su nombre hasta veinte años después.',
 'La lección incómoda de esta historia no es sobre tecnología. Es sobre el instante exacto en que desobedecer a un sistema perfecto fue el acto más responsable posible.'],
 quote:'El protocolo decía «informe». La conciencia dijo «espere». Esa pausa fue la paz.',
 imagesTitle:'Reconstrucciones visuales',

{slug:'tulipanes-de-oro-la-primera-gran-burbuja', cat:'dinero', title:'Tulipanes de oro: la primera gran burbuja',
 tagline:'En 1637, un bulbo de tulipán llegó a costar lo mismo que una casa en Ámsterdam. Hasta que dejó de costarlo.',
 desc:'Holanda inventó el mercado financiero moderno y, de propina, su primera locura colectiva. La fiebre de los tulipanes sigue siendo el espejo de todas las burbujas posteriores.',
 durMin:1, durSec:52, date:'2026-09-08', views:0, yt:null,
 flags:['editors'], tags:['burbujas','especulación','Países Bajos'], sources:['Archivos notariales de Haarlem, 1636–1637'],
 entities:['burbujas','comercio-global'],
 body:[
 'El tulipán llegó a Europa desde el Imperio otomano como una rareza botánica. En 1593 ya florecía en los jardines de Leiden. En la Holanda del siglo XVII —la nación más comercial del mundo— esa rareza dejó de ser un adorno y se convirtió en activo: los bulbos se compraban antes de florecer, se revendían sobre el papel y se negociaban en tabernas, fuera del horario de las bolsas oficiales.',
 'El mecanismo era hipnótico. Un bulbo de la variedad Semper Augustus llegó a pagarse al precio de una casa con canal incluido. Los contratos cambiaban de manos diez veces en una semana sin que nadie viera jamás la flor. El negocio ya no era el tulipán: era la creencia de que mañana alguien pagaría más.',
 'Esa creencia tenía forma legal. Había quien compraba el bulbo. Había quien compraba el derecho a comprarlo más tarde. El papel circulaba más rápido que la tierra. Notarios, artesanos y regentes se sentaron a la misma mesa. La fiebre no distinguía oficio: distinguía quién llegaba a tiempo de venderle el contrato al siguiente.',
 'En febrero de 1637, una subasta rutinaria en Haarlem quedó desierta. Bastó eso. En días, los precios cayeron más de un noventa por ciento. Lo que la víspera valía una casa pasó a valer una promesa que nadie quería honrar. El mercado no se desinfló con un decreto. Se desinfló con una silla vacía.',
 'La leyenda posterior hinchó la ruina: no fue el fin de la República, ni de Ámsterdam. Fue algo más útil para nosotros. Fue el primer ensayo, bien documentado, de una gramática que el capitalismo no ha dejado de repetir: un objeto escaso, un relato de escasez, y un precio que ya no mira al objeto.',
 'Cada generación redescubre esta historia con un disfraz nuevo: acciones, suelo, criptomonedas. El activo cambia. La fiebre, no. Se sigue vendiendo la certeza de que otro pagará más mañana.'],
 quote:'No se vendían flores. Se vendía la certeza de que otro pagaría más mañana.',
 imagesTitle:'Reconstrucciones visuales',

{slug:'enron-los-arquitectos-del-humo', cat:'dinero', title:'Enron: los arquitectos del humo',
 tagline:'La empresa más admirada de América no vendía energía: vendía contabilidad. Y durante años, nadie quiso mirar dentro.',
 desc:'Enron pasó de compañía de gas a símbolo de la nueva economía… y luego al mayor escándalo financiero de su época. Una autopsia del fraude perfecto.',
 durMin:4, durSec:223, date:'2026-09-26', views:0, yt:null,
 flags:['editors'], tags:['fraude','auditoría','Wall Street'], sources:['SEC · Expediente Enron, 2001','Informe del comité especial de la junta de Enron, 2002'],
 entities:['enron','jeff-skilling','fraude'],
 body:[
 'Enron nació como un gasoducto y murió como una idea: la de que los beneficios son una cuestión de imaginación contable. En 1985, de la fusión de dos compañías de gas, salió una empresa de Houston que quería dejar de ser tubería y convertirse en mercado. La energía, decía el relato, ya no se transportaba: se negociaba.',
 'Su dirección construyó cientos de sociedades fantasma cuyo único propósito era esconder deuda y convirtió esa arquitectura en prestigio. Wall Street no vio un laberinto. Vio innovación. Durante años Enron ocupó listas de «empresas más admiradas». El producto no era el gas. Era la certeza de que los números cuadraban porque alguien los había cuadrado.',
 'El truco maestro se llamaba mark-to-market: apuntar como beneficio presente el valor teórico de contratos a veinte años. Si el negocio salía mal, nadie lo veía, porque el beneficio ya se había anotado el primer día. Los analistas aplaudían la transparencia de una empresa cuyo corazón era una caja negra.',
 'La auditora Arthur Andersen firmaba las cuentas. El consejo recibía explicaciones que sonaban a ingeniería financiera de vanguardia. Quien preguntaba demasiado quedaba fuera del relato. El sistema de incentivos —bonus, opciones, ranking interno— no falló. Hizo exactamente lo que estaba diseñado para hacer: premiar el número, no el tubo.',
 'La caída fue geológica: de unos noventa dólares por acción a veintiséis centavos en dieciocho meses. En diciembre de 2001 Enron se acogió al concurso. Veinte mil empleados perdieron el trabajo y, en muchos casos, los ahorros que la empresa les había animado a dejar en sus propias acciones. Andersen, auditora centenaria, desapareció con ella.',
 'Enron no fue un accidente de un villano suelto. Fue un organigrama. Cuando el producto de una empresa es su propia contabilidad, la bancarrota ya está escrita. Solo faltaba la fecha.'],
 quote:'Cuando el producto de una empresa es su propia contabilidad, la bancarrota ya está escrita.',

{slug:'la-caja-que-encogio-el-mundo', cat:'inventos', title:'La caja que encogió el mundo',
 tagline:'No tiene chips, ni motor, ni software. Es una caja de acero. Y sin ella no existiría la globalización.',
 desc:'Malcom McLean, un camionero de Carolina del Norte, se hizo una pregunta en un muelle: ¿y si el camión entero sube al barco? El verdadero invento no fue el acero. Fue dejar de mover las cosas dos veces.',
 durMin:8, durSec:480, date:'2026-07-02', views:0, yt:null,
 flags:['new','editors'], tags:['logística','globalización','transporte'], sources:['Marc Levinson, «The Box», 2006'],
 entities:['malcom-mclean','contenedor','logistica','comercio-global'],
 body:[
 'Antes del contenedor, un puerto era un oficio. Estibadores subían sacos, barriles y cajas sueltas durante días. Más de la mitad del coste de enviar mercancía no estaba en el mar: estaba en el muelle, en cada saco que alguien volvía a tocar. El mundo se movía a hombros.',
 'Malcom McLean conducía camiones en Carolina del Norte. En 1937, según el relato que luego se hizo canónico, esperó horas en un puerto mientras su algodón se descargaba pieza a pieza para volver a cargarse en un barco. La pregunta no era náutica. Era de paciencia: ¿por qué manejar la misma cosa dos veces?',
 'La respuesta tardó casi veinte años. McLean no inventó una caja bonita. Inventó un sistema: el camión, el muelle y el barco tenían que hablar el mismo idioma. En abril de 1956, un petrolero reconvertido llamado Ideal X zarpó de Newark hacia Houston con cincuenta y ocho cajas de acero idénticas sobre cubierta. Levinson recoge la comparación que McLean hizo del coste: dieciséis centavos por tonelada frente a casi seis dólares del método tradicional.',
 'Nadie aplaudió una revolución. Los estibadores vieron una amenaza. Las navieras vieron un experimento. Los puertos no estaban hechos para aquella geometría. El verdadero invento llegó después, cuando las medidas de la caja se volvieron universales: entonces grúas, trenes, camiones y muelles del planeta se rediseñaron alrededor de un rectángulo.',
 'En 1966 el contenedor cruzó el Atlántico como servicio regular. El flete se hundió. Las fábricas pudieron alejarse de los puertos. El objeto barato de otro continente dejó de ser una rareza. La globalización que solemos contar con tratados y banderas tiene una pieza de acero en el centro, opaca, apilable, invisible cuando funciona.',
 'Cada cosa comprada a precio de saldo contiene, sin que se vea, esa caja. McLean no aceleró los barcos. Dejó de mover las mercancías dos veces. El mundo encogió porque el puerto, por fin, dejó de ser un cuello de botella hecho de hombros.'],
 quote:'La pregunta no era cómo mover barcos más rápido. Era cómo dejar de mover las cosas dos veces.',

{slug:'las-rayas-que-gobiernan-el-mundo', cat:'personas', title:'Las rayas que gobiernan el mundo',
 tagline:'Nació en la arena, inspirado en código Morse. Hoy se escanea miles de millones de veces al día.',
 desc:'Norman Joseph Woodland dibujó en una playa de Florida las líneas que hoy leen el comercio entero. El código de barras parece trivial. Es una de las infraestructuras más poderosas del siglo XX.',
 durMin:1, durSec:45, date:'2026-08-27', views:0, yt:'tYlkXZETVfQ',
 flags:['featured','editors','new'], tags:['retail','datos','automatización'], sources:['USPTO · Patente 2.612.994'],
 entities:['norman-woodland','codigo-de-barras','gran-consumo'],
 body:[
 'La semilla fue un encargo prosaico: un director de supermercado pidió un sistema para leer el producto en caja sin teclear nada. A Norman Joseph Woodland se le ocurrió la respuesta sentado en una playa de Florida: dibujó líneas en la arena, como un código Morse ensanchado.',
 'La patente llegó en 1952, pero la tecnología láser para leerla aún no existía. El 26 de junio de 1974, en un supermercado de Troy, Ohio, un paquete de chicles Wrigley se convirtió en el primer producto de la historia escaneado en una caja.',
 'El código de barras hizo algo más profundo que acelerar colas: convirtió cada objeto en un dato. Inventario en tiempo real, reposición automática, logística global: todo cuelga de esas líneas.',
 'Es la infraestructura perfecta: invisible, universal y tan fiable que nadie la nota. Hasta que un lector falla y el mundo moderno hace cola.'],
 quote:'Woodland dibujó líneas en la arena. Medio siglo después, esas líneas contaban el mundo entero.',
 imagesTitle:'Reconstrucciones visuales',
 imagesNote:'Estas imágenes no son fotografías históricas. Son reconstrucciones visuales de Woodland, la playa y el código. No representan un documento de archivo.',
 images:[

  {src:MEDIA_ROOT+'/stories/woodland/2.jpg', alt:'Reconstrucción visual. Norman Joseph Woodland, el hombre que dibujó el código en la arena.'},

  {src:MEDIA_ROOT+'/stories/woodland/5.jpg', alt:'Reconstrucción visual. La playa donde Woodland ensanchó el código Morse.'}

{slug:'xerox-parc-el-laboratorio-que-regalo-el-manana', cat:'empresas', title:'Xerox PARC: el laboratorio que regaló el mañana',
 tagline:'Inventaron el ratón, la interfaz gráfica, el Ethernet y la impresión láser. Y vieron, desde la ventana, cómo otros construían imperios con sus piezas.',
 desc:'En Palo Alto, un grupo de genios sin fecha de entrega construyó el ordenador personal una década antes de que el mundo supiera que lo quería.',
 durMin:8, durSec:480, date:'2026-08-18', views:0, yt:null,
 flags:['editors'], tags:['Silicon Valley','informática','innovación'], sources:['Hiltzik, «Dealers of Lightning», 1999'],
 entities:['xerox','alan-kay','interfaz-grafica'],
 body:[
 'Xerox dominaba un negocio tan rentable que sus ejecutivos decían que las fotocopiadoras «se alquilaban solas». Con ese colchón, en 1970 crearon PARC: un laboratorio en Palo Alto con la misión declarada de «arquitectar el futuro» y sin ninguna obligación de venderlo.',
 'Allí, en apenas cinco años, Alan Kay imaginó el ordenador como herramienta personal, se construyó el Alto —ventanas, iconos y ratón—, nació el Ethernet y la impresora láser hizo rentable el invento. PARC había fabricado, pieza a pieza, el despacho del futuro.',
 'El problema nunca fue técnico. La empresa que más sabía de papel no supo ver una pantalla.',
 'Años después, un joven visitante de Apple vio esas mismas ventanas y ratones. El resto —Macintosh, Windows, la era personal— es la historia de PARC contada con otra firma.'],
 quote:'PARC no fracasó en inventar el futuro. Fracasó en algo más difícil: convencer a su propio presente.',
 timeline:[['1970','Xerox funda PARC en Palo Alto con carta blanca.'],['1973','Nace el Alto: ventanas, iconos, ratón y Ethernet.'],['1979','Steve Jobs visita PARC. Cuatro años después llega el Macintosh.']]},
{slug:'el-rey-del-hielo', cat:'dinero', title:'El rey del hielo',
 tagline:'No inventó el frío. Inventó cómo venderlo al otro lado del mundo, antes de que se derritiera.',
 desc:'Frederic Tudor cargó hielo de los estanques de Boston hacia el trópico. El primer viaje fue un fracaso. La fortuna llegó cuando el mundo aprendió a pagar por algo que, hasta entonces, era solo invierno.',
 durMin:1, durSec:60, date:'2026-08-17', views:0, yt:'VKikVkIX-wQ',
 flags:['featured','new','editors'], tags:['comercio','logística','siglo XIX'], sources:['Gavin Weightman, «The Frozen Water Trade»','Harvard Business School · Tudor Ice Company records'],
 entities:['frederic-tudor','cadena-de-frio','comercio-global'],
 body:[
  'El invierno de Nueva Inglaterra era un residuo. Los estanques se congelaban, los caminos se cerraban y el frío no servía para nada... excepto para esperar a que se fuera. En 1806, un bostoniano de veintitrés años llamado Frederic Tudor apostó lo contrario: que el hielo de un estanque podía ser mercancía. Cargó un barco rumbo a Martinica. Gran parte del cargamento no llegó. El que llegó no encontró quién lo comprara. La idea parecía una broma cara.',
  'Tudor no vendía un bloque. Vendía tiempo. La posibilidad de que la carne, la bebida o un enfermo febril no tuvieran que rendirse al calor del mismo día. Eso exigía dos inventos a la vez. Uno era técnico: serrín, paja, almacenes de muros gruesos, un barco tratado como nevera. El otro era comercial: convencer a un trópico de que el frío valía dinero. Sin demanda, el hielo era solo agua aplazada.',
  'Los primeros años fueron deuda, burla y más viajes. Tudor insistió en los diarios de a bordo y en los libros de cuentas. Fue construyendo una red: cortar el hielo en invierno, aislarlo, cruzar el Atlántico, guardarlo a la llegada. El producto no se fabricaba. Se movía. La fortuna, si llegaba, nacería de ganar una carrera contra el deshielo.',
  'En 1833 el bergantín Tuscany zarpó de Boston hacia Calcuta con un cargamento de hielo de Nueva Inglaterra. Cruzó el mundo una mercancía que, por definición, no debería haber sobrevivido al trópico. El desembarco no fue un milagro: fue aislamiento, ruta y un mercado que Tudor había ido educando durante décadas. El estanque de Massachusetts había encontrado un precio en la India.',
  'Tudor murió rico, en 1864. El oficio que había montado —cortar, empacar, enviar— empleó a miles de personas en la costa este de Estados Unidos. No era todavía la cadena de frío de las vacunas y los supermercados. Era su antecedente comercial: el frío como infraestructura, no como clima. Cuando llegó la máquina de hacer hielo, el estanque dejó de ser un imperio. Quedó la lección.',
  'Esta historia no pregunta si Tudor fue un visionario simpático. Pregunta de dónde sale una fortuna cuando el producto se derrite. A veces no se inventa una cosa nueva. Se inventa cómo mover lo que ya existe, a tiempo, y cobrar por ello.'],
 quote:'No vendía hielo: vendía la idea de que el verano podía posponerse.',

{slug:'db-cooper-el-hombre-que-se-evaporo', cat:'misterios', title:'El hombre que se evaporó',
 tagline:'Secuestró un avión, pidió 200.000 dólares, saltó de noche sobre un bosque… y jamás volvió a existir.',
 desc:'El 24 de noviembre de 1971, un pasajero educado de traje oscuro hizo el atraco más elegante de la historia y desapareció. El FBI cerró el caso 45 años después sin un sospechoso firme.',
 durMin:4, durSec:233, date:'2026-08-29', views:0, yt:'-Oe_hmY8Za4',
 flags:['featured','new'], tags:['aviación','casos abiertos','EE. UU.'], sources:['FBI · Expediente NORJAK, cerrado 8 de julio de 2016'],
 entities:['d-b-cooper','misterios'],
 body:[
 'El 24 de noviembre de 1971, víspera de Acción de Gracias, un hombre pagó en efectivo un billete de Portland a Seattle. En el talón escribió un nombre corriente: Dan Cooper. Traje oscuro, corbata, maletín. Pidió un bourbon con soda. Nada en aquel gesto anunciaba un secuestro.',
 'A poco de despegar el vuelo 305 de Northwest Orient, entregó una nota a una azafata: llevaba una bomba en el maletín. Lo que pidió después no parecía el delirio de un pirata: doscientos mil dólares en billetes de veinte, sin marcar, y cuatro paracaídas. Dos principales. Dos de reserva. Como si hubiera estudiado el procedimiento.',
 'En Seattle canjeó a los pasajeros por el dinero y los paracaídas. Dejó a bordo a la tripulación. Hizo repostar. Y dio instrucciones de vuelo tan precisas que aún hoy se leen como un manual: rumbo sur, hacia México; diez mil pies; baja velocidad; flaps extendidos; tren de aterrizaje abajo. Quería un avión lento. Quería una puerta.',
 'Esa puerta era la escalera trasera de un Boeing 727. Pocos aviones de línea permitían abrirla en vuelo. Cooper lo sabía. Sobre el suroeste de Washington, de noche, con tormenta, la escalera bajó. Cuando el avión aterrizó en Reno, Cooper ya no estaba. El asiento vacío era todo el escenario.',
 'La prensa deformó el nombre. Dan Cooper se convirtió en D. B. Cooper. El FBI abrió el expediente NORJAK, registró los números de serie de cada billete y entrevistó a más de mil sospechosos. En febrero de 1980, un niño encontró en una playa del río Columbia unos cinco mil ochocientos dólares del rescate. Fue casi todo lo que el caso produjo.',
 'El 8 de julio de 2016 el FBI cerró el expediente sin un sospechoso firme. Cooper sigue siendo el único secuestro aéreo comercial no resuelto de Estados Unidos. El misterio no es solo dónde cayó. Es cómo alguien puede dejar de existir sin dejar de estar en todas partes.'],
 quote:'El misterio no es dónde cayó. Es cómo alguien puede dejar de existir sin dejar de estar en todas partes.',
 imagesTitle:'Reconstrucciones visuales',
 imagesNote:'Estas imágenes no son fotografías del caso. Son reconstrucciones visuales del vuelo, la escalera y el bosque. No representan un documento de archivo.',
 images:[
  {src:MEDIA_ROOT+'/stories/cooper/1.jpg', alt:'Reconstrucción visual. Un pasajero de traje en un Boeing 727, víspera de Acción de Gracias.'},
  {src:MEDIA_ROOT+'/stories/cooper/2.jpg', alt:'Reconstrucción visual. El maletín, el asiento y una nota que no parece un delirio.'},
  {src:MEDIA_ROOT+'/stories/cooper/3.jpg', alt:'Reconstrucción visual. La cabina: rumbo, altitud y una puerta que no debería abrirse.'},
  {src:MEDIA_ROOT+'/stories/cooper/4.jpg', alt:'Reconstrucción visual. La escalera trasera del 727, abierta sobre el bosque de noche.'},
  {src:MEDIA_ROOT+'/stories/cooper/5.jpg', alt:'Reconstrucción visual. El asiento vacío al aterrizar en Reno.'},
  {src:MEDIA_ROOT+'/stories/cooper/6.jpg', alt:'Reconstrucción visual. El río Columbia: años después, una parte del rescate bajo la arena.'}

{slug:'la-vacuna-que-no-se-patento', cat:'personas', title:'La vacuna que no se patentó',
 tagline:'Tenía la vacuna de la polio. Le preguntaron quién la poseía. Dijo que la gente. Como el sol.',
 desc:'Jonas Salk no vendió el vial. En 1955 anunció una vacuna y rechazó patentarla. El virus que llenaba los hospitales empezó a retirarse. Él no se hizo rico con aquello.',
 durMin:1, durSec:33, date:'2026-08-20', views:0, yt:'U4jWK8RC1bM',
 flags:['new','editors'], tags:['medicina','polio','siglo XX'], sources:['March of Dimes · archivo Salk, 1955','Smithsonian · National Museum of American History'],
 entities:['jonas-salk','vacuna-polio'],
 body:[
 'En los años cincuenta la poliomielitis no era un dato: era un verano. Piscinas cerradas, padres asustados, salas con pulmones de acero. Jonas Salk, en Pittsburgh, buscaba una vacuna de virus inactivado: enseñar al cuerpo el enemigo sin dejarlo circular.',
 'El doce de abril de 1955 se anunció que funcionaba. La pregunta siguiente no fue médica. Fue de propiedad. ¿De quién es el vial? Salk contestó con una frase que todavía circula: no se puede patentar el sol. No hubo un monopolio sobre aquella fórmula. La producción se extendió.',
 'La polio no desapareció en un día. Retrocedió. Los hospitales se vaciaron de aquello que los había definido. Salk siguió en el laboratorio y en el instituto que lleva su nombre. No cobró un canon por cada brazo pinchado.',
 'Esta historia no pide un santo. Pide una decisión: cuando un invento puede salvar a millones, a veces el negocio es no convertirlo en negocio.'],
 quote:'Le preguntaron quién poseía la vacuna. Dijo que la gente. Como el sol.',

 imagesNote:'Estas imágenes no son fotografías de archivo médico. Son reconstrucciones del laboratorio, la sala de prensa y el gesto de vacunar. No representan un documento clínico.',

  {src:MEDIA_ROOT+'/stories/salk/1.jpg', alt:'Reconstrucción visual. Laboratorio de los años cincuenta: el vial se cocina en cristal, no en un despacho de patentes.'},
  {src:MEDIA_ROOT+'/stories/salk/2.jpg', alt:'Reconstrucción visual. Un pasillo de hospital y los pulmones de acero que la vacuna iba a dejar obsoletos.'},

{slug:'mary-celeste-el-barco-que-llego-vacio', cat:'misterios', title:'Mary Celeste: el barco que llegó vacío',
 tagline:'Iba a Génova. Lo encontraron en medio del Atlántico, marinero, con la carga… y sin nadie.',
 desc:'El 4 de diciembre de 1872 el Dei Gratia avistó la Mary Celeste. El bote salvavidas faltaba. La tripulación también. Gibraltar no cerró el caso. El barco volvió a navegar. Ellos, no.',
 durMin:4, durSec:212, date:'2026-08-22', views:0, yt:'BKaHcCAWJow',
 flags:['featured','new'], tags:['mar','casos abiertos','siglo XIX'], sources:['National Archives (UK) · Gibraltar Vice-Admiralty, 1873','Paul Begg, «Mary Celeste: The Greatest Mystery of the Sea»'],
 entities:['mary-celeste','misterios'],
 body:[
 'El cuatro de diciembre de mil ochocientos setenta y dos, el bergantín Dei Gratia avistó otra vela en el Atlántico. Se llamaba Mary Celeste. Iba hacia Gibraltar. Las velas no estaban puestas como deben. Nadie contestó al grito.',
 'Subieron a bordo. El barco no se hundía. En la cabina había platos, una máquina de coser, el diario. En la bodega, barriles de alcohol comercial, casi todos intactos. Faltaba el bote. Faltaba la gente.',
 'El capitán era Benjamin Briggs. Viajaba con su mujer, su hija y siete hombres. Habían zarpado de Nueva York el siete de noviembre rumbo a Génova. El último asiento del diario es del veinticinco de noviembre, cerca de las Azores. Después, nada.',
 'No había sangre ni signos claros de motín. Un barco marinero, vacío, avanzando solo. El Dei Gratia lo llevó a Gibraltar. Seguros, jueces, rumores: piratas, un barril que goteaba, un mar que se tragó el bote. Cada teoría explica una pieza y deja hueca la siguiente.',
 'En mil ochocientos setenta y tres la corte no resolvió el misterio. La Mary Celeste volvió a navegar. En mil ochocientos ochenta y cinco la encallaron en Haití para un fraude de seguros. El casco murió de una estafa. Las diez almas de 1872 no aparecieron.',
 'El misterio no es que el mar se trague gente. Es que a veces deja el barco.'],
 quote:'El misterio no es que el mar se trague gente. Es que a veces deja el barco.',

{slug:'el-radar-que-se-colo-en-la-cocina', cat:'inventos', title:'El radar que se coló en la cocina',
 tagline:'A Percy Spencer se le derritió el chocolate junto a un magnetrón. El siglo XX empezó a cenar de otra manera.',
 desc:'En 1945 un radar de guerra calentó lo que no debía. Spencer probó palomitas. Luego un huevo. Raytheon patentó el Radarange. Décadas después el horno cabe en cualquier cocina.',
 durMin:1, durSec:48, date:'2026-09-01', views:0, yt:null,
 flags:['new'], tags:['radar','cocina','siglo XX'], sources:['Raytheon · archivo Radarange','Smithsonian · National Museum of American History'],
 entities:['percy-spencer','horno-microondas'],
 body:[
 'En 1945, en un laboratorio de Raytheon, Percy Spencer trabajaba junto a un magnetrón: el corazón de un radar de guerra. El chocolate que llevaba en el bolsillo se derritió. No era un truco. Era agua agitada por una frecuencia que no se había pensado para merendar.',
 'Spencer acercó palomitas. Luego un huevo. El huevo explotó. La pregunta dejó de ser militar. ¿Servía aquello para cenar? Raytheon patentó el Radarange: un armario caro, del tamaño de un frigorífico, que décadas después encogió hasta la encimera.',
 'No se inventó una receta. Se inventó un atajo. Un accidente de bolsillo reordenó cómo come el siglo veinte.'],
 quote:'Un radar de guerra acabó calentando la cena. El atajo nació de un bolsillo manchado.',
 imagesTitle:'Reconstrucciones visuales',
 imagesNote:'Estas imágenes no son fotografías de archivo industrial. Son reconstrucciones del laboratorio, el prototipo y la cocina. No representan un documento de empresa.',
 images:[
  {src:MEDIA_ROOT+'/stories/microondas/1.jpg', alt:'Reconstrucción visual. Laboratorio de radar: el magnetrón sobre el banco, no en un folleto.'},
  {src:MEDIA_ROOT+'/stories/microondas/2.jpg', alt:'Reconstrucción visual. El chocolate derretido junto al aparato de guerra.'},
  {src:MEDIA_ROOT+'/stories/microondas/3.jpg', alt:'Reconstrucción visual. Palomitas junto al generador: la prueba que no estaba en el manual.'},
  {src:MEDIA_ROOT+'/stories/microondas/4.jpg', alt:'Reconstrucción visual. El primer horno, del tamaño de un armario.'},
  {src:MEDIA_ROOT+'/stories/microondas/5.jpg', alt:'Reconstrucción visual. Décadas después, el atajo cabe en cualquier encimera.'}

{slug:'el-medico-que-pidio-lavarse-las-manos', cat:'personas', title:'El médico que pidió lavarse las manos',
 tagline:'En una sala morían más. En la otra, menos. Semmelweis vio las uñas. Le costó la carrera.',
 desc:'En 1847, en Viena, Ignaz Semmelweis ordenó lavarse las manos con cal clorada. Las muertes en el parto cayeron. No le creyeron. Pasteur y Lister, después, le dieron la razón.',
 durMin:1, durSec:45, date:'2026-09-03', views:0, yt:'BI0cH7WVTuE',
 flags:['new'], tags:['medicina','higiene','siglo XIX'], sources:['Semmelweis, «Die Ätiologie», 1861','WHO · higiene de manos'],
 entities:['ignaz-semmelweis','higiene'],
 body:[
 'En 1847, en el Hospital General de Viena, las mujeres morían al dar a luz. En la sala de los médicos, más. En la de las comadronas, menos. Ignaz Semmelweis no buscó un misterio: buscó una diferencia. Los médicos llegaban de la sala de autopsias. Las comadronas, no.',
 'Ordenó lavarse las manos con cal clorada. Las muertes cayeron. No era un rito. Era la frontera entre un parto y un funeral. El hospital no le dio la razón: le dio el vacío. Lo apartaron. Murió encerrado.',
 'Décadas después, Pasteur y Lister nombraron lo que él había medido. El jabón no era un detalle de urbanidad. Era infraestructura.'],
 quote:'El jabón no era un detalle. Era la frontera entre un parto y un funeral.',
 imagesTitle:'Reconstrucciones visuales',
 imagesNote:'Estas imágenes no son fotografías clínicas de 1847. Son reconstrucciones de la sala, el lavabo y el patio. No representan un documento hospitalario.',
 images:[
  {src:MEDIA_ROOT+'/stories/semmelweis/1.jpg', alt:'Reconstrucción visual. Una sala de partos de Viena, de noche.'},
  {src:MEDIA_ROOT+'/stories/semmelweis/2.jpg', alt:'Reconstrucción visual. Palanganas y lino: el hospital como taller.'},
  {src:MEDIA_ROOT+'/stories/semmelweis/3.jpg', alt:'Reconstrucción visual. Cal clorada y agua: la orden que no quisieron oír.'},
  {src:MEDIA_ROOT+'/stories/semmelweis/4.jpg', alt:'Reconstrucción visual. El pasillo vacío entre dos salas que no morían igual.'},
  {src:MEDIA_ROOT+'/stories/semmelweis/5.jpg', alt:'Reconstrucción visual. El patio del hospital al anochecer.'}

 timeline:[['1847','Semmelweis impone el lavado con cal clorada. La fiebre puerperal cae.'],['1849','Lo apartan de Viena. La medida no se convierte en norma.'],['AÑOS 60','Pasteur y Lister dan marco a lo que él ya había contado en muertos.'] ]},
{slug:'el-reloj-que-encontro-el-mar', cat:'historia', title:'El reloj que encontró el mar',
 tagline:'El mar no se pierde por falta de valor. Se pierde por no saber dónde estás.',
 desc:'Tras el naufragio de las Sorlingas, el Parlamento británico pagó por la longitud. Los astrónomos miraron al cielo. John Harrison metió un puerto en un reloj. Greenwich se volvió el meridiano del mundo.',
 durMin:3, durSec:197, date:'2026-09-05', views:0, yt:null,
 flags:['new','editors'], tags:['navegación','siglo XVIII','Greenwich'], sources:['Sobel, «Longitude», 1995','Royal Museums Greenwich · Harrison collection'],
 entities:['john-harrison','cronometro-marino','navegacion'],
 body:[
 'El mar no se pierde por falta de valor. Se pierde por no saber dónde estás. En el siglo XVIII un capitán medía la latitud con el sol. La longitud era otra guerra. Sin ella, un barco era un punto ciego en un mapa.',
 'En 1707 la flota de Clowdisley Shovell se estrelló contra las Sorlingas. Murieron más de mil hombres. El Parlamento ofreció veinte mil libras a quien resolviera cómo saber, en alta mar, qué meridiano pisabas.',
 'Los astrónomos querían el cielo: la luna, Greenwich, tablas. John Harrison era un relojero de pueblo. Entendió otra cosa: si llevas la hora exacta de un puerto y la comparas con el mediodía local, cada hora son quince grados. El problema no era el cielo. Era un reloj que no se rindiera al barco.',
 'Tardó décadas. El H1 era un monstruo de metal. El H4 cabía en la mano. En el viaje a Jamaica el error fue de millas, no de océanos. El Board of Longitude no se lo puso fácil. El Almirantazgo acabó usando la idea. Greenwich se convirtió en el meridiano del mundo.',
 'Cada GPS de hoy sigue, en el fondo, aquella apuesta: el tiempo como posición. No ganó quien miraba más alto. Ganó quien hizo que un puerto cupiera en un reloj.'],
 quote:'No ganó quien miraba más alto. Ganó quien hizo que un puerto cupiera en un reloj.',
 imagesTitle:'Reconstrucciones visuales',
 imagesNote:'Estas imágenes no son fotografías de archivo naval. Son reconstrucciones del naufragio, el taller y el cronómetro. No representan un documento del Almirantazgo.',

  {src:MEDIA_ROOT+'/stories/harrison/1.jpg', alt:'Reconstrucción visual. Un velero en un Atlántico gris: sin longitud, el mapa miente.'},
  {src:MEDIA_ROOT+'/stories/harrison/2.jpg', alt:'Reconstrucción visual. Las Sorlingas, 1707: el error de posición tiene costa.'},
  {src:MEDIA_ROOT+'/stories/harrison/3.jpg', alt:'Reconstrucción visual. El premio de la longitud, sobre una mesa, no en el cielo.'},
  {src:MEDIA_ROOT+'/stories/harrison/4.jpg', alt:'Reconstrucción visual. Greenwich: el cielo como rival del reloj.'},
  {src:MEDIA_ROOT+'/stories/harrison/5.jpg', alt:'Reconstrucción visual. El taller de un relojero de pueblo.'},
  {src:MEDIA_ROOT+'/stories/harrison/6.jpg', alt:'Reconstrucción visual. El H1: una máquina contra el oleaje.'},
  {src:MEDIA_ROOT+'/stories/harrison/7.jpg', alt:'Reconstrucción visual. El H4: un puerto que cabe en la mano.'},

 ],

{slug:'el-alud-de-azucar', cat:'historia', title:'El alud de azúcar',
 tagline:'En 1919 un tanque de melaza se partió en Boston. No fue un incendio. Fue un muro.',
 desc:'Catorce mil toneladas. Una ola de ocho metros. Veintiuna personas muertas. La compañía habló de sabotaje. Los jueces, de un tanque mal remachado.',
 durMin:1, durSec:45, date:'2026-09-10', views:0, yt:null,
 flags:['new'], tags:['Boston','industria','siglo XX'], sources:['Puleo, «Dark Tide»','Sentencia del caso USIA, 1925'],
 entities:['boston-melaza'],
 body:[
 'En enero de 1919, en Boston, un tanque de catorce mil toneladas de melaza se partió. No fue un incendio. Fue un muro. Una ola de ocho metros, más densa que el agua, a cincuenta kilómetros por hora.',
 'Arrancó edificios. Volcó un tren. El invierno pegó el azúcar a las calles. Murieron veintiuna personas. El olor duró años.',
 'La compañía habló de sabotaje. Los jueces, de un tanque mal remachado. El barrio, de un alud que no debería existir.'],
 quote:'No fue un incendio. Fue un muro.',
 imagesTitle:'Reconstrucciones visuales',
 imagesNote:'Estas imágenes no son fotografías del desastre. Son reconstrucciones del tanque, la ola y el barrio. No representan un documento de archivo.',
 images:[
  {src:MEDIA_ROOT+'/stories/melaza/1.jpg', alt:'Reconstrucción visual. El tanque sobre el barrio, antes de partirse.'},
  {src:MEDIA_ROOT+'/stories/melaza/2.jpg', alt:'Reconstrucción visual. Una calle de Boston en invierno, pegajosa y quieta.'},
  {src:MEDIA_ROOT+'/stories/melaza/3.jpg', alt:'Reconstrucción visual. El alud: más denso que el agua.'},
  {src:MEDIA_ROOT+'/stories/melaza/4.jpg', alt:'Reconstrucción visual. Madera y acero retorcidos.'},
  {src:MEDIA_ROOT+'/stories/melaza/5.jpg', alt:'Reconstrucción visual. Después: el olor que no se va.'}
 ],
 timeline:[['ENE 1919','El tanque de la USIA se parte en el North End de Boston.'],['1925','El juicio señala el tanque, no el sabotaje.'] ]},
{slug:'las-chicas-del-radio', cat:'personas', title:'Las chicas del radio',
 tagline:'No brillaban por fama. Brillaban porque se les había pedido que lo hicieran.',
 desc:'Pintaban esferas de reloj con radio. Mojaban el pincel en los labios. Grace Fryer y otras compañeras llevaron el veneno a los tribunales.',
 durMin:4, durSec:240, date:'2026-09-12', views:0, yt:null,
 flags:['new','editors'], tags:['trabajo','industria','siglo XX'], sources:['Moore, «The Radium Girls»','Caso Fryer v. U.S. Radium, 1927–28'],
 entities:['grace-fryer','radio'],
 body:[
 'En Orange, Nueva Jersey, un grupo de jóvenes pintaba esferas de reloj con una pintura que relucía en la oscuridad. El truco se llamaba lip pointing: mojar el pincel en los labios.',
 'La empresa se protegía. Ellas, no. El polvo iba al pelo, a la comida, a los huesos. Primero se cayeron los dientes. Luego la mandíbula.',
 'Grace Fryer y otras compañeras demandaron. En 1928 el caso ya no cabía en una fábrica: cabía en los periódicos. El radio dejó de ser adorno.'],
 quote:'El cuerpo también es un archivo.',
 imagesTitle:'Reconstrucciones visuales',
 imagesNote:'Estas imágenes no son fotografías de las trabajadoras. Son reconstrucciones de la fábrica, el polvo y el tribunal. No representan un documento de archivo.',
 images:[
  {src:MEDIA_ROOT+'/stories/radium/1.jpg', alt:'Reconstrucción visual. La fábrica de relojes al anochecer.'},
  {src:MEDIA_ROOT+'/stories/radium/2.jpg', alt:'Reconstrucción visual. Bancos de esferas y polvo en el aire.'},
  {src:MEDIA_ROOT+'/stories/radium/3.jpg', alt:'Reconstrucción visual. El pincel y el bote de pintura luminosa.'},
  {src:MEDIA_ROOT+'/stories/radium/5.jpg', alt:'Reconstrucción visual. El laboratorio protegido y la sala que no lo estaba.'},
  {src:MEDIA_ROOT+'/stories/radium/8.jpg', alt:'Reconstrucción visual. Un reloj que brilla en la mesilla.'}
 ],
 timeline:[['AÑOS 10–20','Pintoras de esferas en Nueva Jersey. Lip pointing.'],['1927–28','Demandas. El radio deja de ser milagro publicitario.'] ]},
{slug:'el-invento-que-salio-de-un-perro', cat:'inventos', title:'El invento que salió de un perro',

 body:[
 'En 1941, a George de Mestral se le llenó el perro de cardos. Bajo la lupa, cada gancho se clavaba y no soltaba.',
 'Tardó años en copiarlo: una tira de ganchos, otra de bucles. El ejército lo entendió antes que la moda.',
 'No inventó un material. Inventó un gesto que la naturaleza ya había resuelto.'],
